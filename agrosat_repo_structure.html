*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-mono);font-size:13px}
.tree{padding:1rem 0}

.icon{font-size:15px;flex-shrink:0}
.name{color:var(--color-text-primary);font-size:13px;font-weight:400}

.detail-panel .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:.5rem}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);color:var(--color-text-secondary)}
.header{display:flex;align-items:center;gap:10px;padding:.75rem 1rem;background:var(--color-background-secondary);border-radius:10px;margin-bottom:.75rem;border:0.5px solid var(--color-border-tertiary)}

</style>

let selected = null;

function makeNode(node, depth=0){
  const div = document.createElement('div');
  div.className = 'node';
  const row = document.createElement('div');
  row.className = 'row';
  const toggle = document.createElement('span');
  toggle.className = 'toggle' + (node.children ? '' : ' leaf');
  toggle.innerHTML = node.children ? '<i class="ti ti-chevron-right" aria-hidden="true"></i>' : '';
  const icon = document.createElement('i');
  icon.className = 'ti ' + (node.icon||'ti-file') + ' icon';
  icon.style.color = node.type==='folder'||node.type==='root' ? 'var(--color-text-warning)' : 'var(--color-text-secondary)';
  icon.setAttribute('aria-hidden','true');
  const name = document.createElement('span');
  name.className = 'name' + (node.children ? ' folder' : '');
  name.textContent = node.name;
  row.appendChild(toggle);
  row.appendChild(icon);
  row.appendChild(name);
  if(node.badge){
    const b = document.createElement('span');
    b.className = 'badge ' + node.badge.color;
    b.textContent = node.badge.text;
    row.appendChild(b);
  }
  if(node.desc){
    const d = document.createElement('span');
    d.className = 'desc';
    d.textContent = node.desc;
    row.appendChild(d);
  }
  div.appendChild(row);
  let childWrap = null;
  if(node.children){
    childWrap = document.createElement('div');
    childWrap.className = 'children';
    childWrap.style.display = depth < 1 ? 'block' : 'none';
    if(depth < 1) toggle.querySelector('i').style.transform = 'rotate(90deg)';
    node.children.forEach(c => childWrap.appendChild(makeNode(c, depth+1)));
    div.appendChild(childWrap);
    row.addEventListener('click', ()=>{
      const open = childWrap.style.display !== 'none';
      childWrap.style.display = open ? 'none' : 'block';
      const ic = toggle.querySelector('i');
      if(ic) ic.style.transform = open ? '' : 'rotate(90deg)';
    });
  }
  if(node.detail){
    row.addEventListener('click', (e)=>{
      if(selected) selected.classList.remove('active');
      selected = row;
      row.classList.add('active');
      showDetail(node);
    });
  }
  return div;
}

function showDetail(node){
  const panel = document.getElementById('detail');
  panel.style.display = 'block';
  const d = node.detail;
  panel.innerHTML = `
    <h3><i class="ti ${node.icon} icon" style="font-size:16px" aria-hidden="true"></i> ${d.title}</h3>
    <p>${d.desc}</p>
    <div class="tags">${(d.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div>
  `;
}

const tree = document.getElementById('tree');
tree.appendChild(makeNode(data));
